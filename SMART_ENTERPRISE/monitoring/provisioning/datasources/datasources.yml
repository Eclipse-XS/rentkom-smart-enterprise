apiVersion: 1

datasources:
  - name: PostgreSQL Real Estate
    uid: lab5-postgres
    type: postgres
    access: proxy
    url: "${POSTGRES_HOST}:5432"
    user: "${POSTGRES_USER}"
    isDefault: true
    jsonData:
      database: "${POSTGRES_DB}"
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"

  - name: Rentkom Business Core API
    uid: rentkom-core-api
    type: marcusolsson-json-datasource
    access: proxy
    url: "http://${API_HOST}:8000/api/v1/analytics/summary"
    jsonData:
      httpHeaderName1: "X-Admin-Token"
    secureJsonData:
      httpHeaderValue1: "${ADMIN_API_KEY}"

  - name: Rentkom LR3 Google Sheets Analytics
    uid: rentkom-lr3-sheets
    type: marcusolsson-json-datasource
    access: proxy
    url: "http://n8n:5678/webhook/lab5/customer-satisfaction"
