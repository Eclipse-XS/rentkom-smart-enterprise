name: Rentkom CI

on:
  push:
    branches: [ main, feature/*, fix/*, remediation/* ]
  pull_request:
    branches: [ main ]

env:
  PYTHONPATH: .

jobs:
  lint-and-contracts:
    name: Syntax, Security & Workflow Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile All Python Modules
        run: |
          python -m compileall -q core tools tests

      - name: Validate n8n Workflow JSON Contracts
        run: |
          pytest tests/unit/test_n8n_workflows_contract.py -v --tb=short

      - name: Validate Docker Compose Profiles
        run: |
          docker compose --profile demo config --quiet
          docker compose --profile connected config --quiet
          docker compose --profile full-ai config --quiet
          docker compose --profile dedicated-worker config --quiet

      - name: Build and Scan Hardened n8n Image
        run: |
          docker build --file Dockerfile.n8n --tag rentkom/n8n:ci .
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --scanners vuln --severity CRITICAL --exit-code 1 --skip-version-check rentkom/n8n:ci

  unit-and-security-tests:
    name: Unit, Security & SMTP Transport Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit, Security & Safety Suite
        run: |
          pytest tests/unit tests/security -v --tb=short

      - name: Run Security & Integration Regression Invariant Suites
        run: |
          pytest tests/integration/test_notification_delivery_invariants.py tests/integration/test_connected_telegram_acceptance.py tests/integration/test_database_release_invariants.py tests/integration/test_ops_release_invariants.py tests/integration/test_rag_release_invariants.py -v --tb=short

      - name: Run SMTP & Telegram Connected Contract Suite
        run: |
          pytest tests/integration/test_smtp_delivery.py tests/integration/test_telegram_connected_mode_contract.py -v --tb=short

  postgres-integration:
    name: PostgreSQL Integration, Migrations & Backup/Restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: rentkom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rentkom_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_password@127.0.0.1:5432/rentkom_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify SQL Bootstrap & Idempotent Migration Scripts
        run: |
          PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -U postgres -d rentkom_test -v ON_ERROR_STOP=1 -f SMART_ENTERPRISE/database/init_db.sql
          PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -U postgres -d rentkom_test -v ON_ERROR_STOP=1 -f SMART_ENTERPRISE/database/schema_v2.sql
          PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -U postgres -d rentkom_test -v ON_ERROR_STOP=1 -f SMART_ENTERPRISE/database/schema_v2.sql
          PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -U postgres -c "DROP DATABASE rentkom_test;"
          PGPASSWORD=postgres_ci_password psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE rentkom_test;"

      - name: Run PostgreSQL Integration & Backup/Restore Tests
        run: |
          pytest tests/integration tests/e2e -v --tb=short
