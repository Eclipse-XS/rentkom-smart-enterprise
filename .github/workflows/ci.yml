name: Rentkom CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Autonomous Unit Tests & Syntax Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax & Compilation
        run: |
          python -m compileall core/ tests/ tools/ scripts/

      - name: Run Autonomous Unit Test Suite
        run: |
          python -m pytest tests/unit/ -v --tb=short
